<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti, bonita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#160b14;
    --bg-2:#3a1330;
    --bg-3:#6e1f4a;
    --card:#fbf6ee;
    --card-2:#f4ecdd;
    --ink:#2c2620;
    --ink-soft:#948573;
    --accent:#b4893f;
    --accent-soft:#d8c9a8;
    --line:rgba(44,38,32,0.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{
    height:100%;
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg-1);
    color:var(--ink);
    overflow-x:hidden;
  }
  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 18px;
    position:relative;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,168,90,0.10), transparent 55%),
      linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 58%, var(--bg-3) 100%);
  }

  /* ---------- ambient background: minimal, few elements ---------- */
  .ambient{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .amb-heart{
    position:absolute;
    bottom:-8%;
    opacity:0;
    color:rgba(226,190,140,0.28);
    font-size:15px;
    animation:driftUp linear infinite;
  }
  @keyframes driftUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    12%{ opacity:0.5; }
    88%{ opacity:0.25; }
    100%{ transform:translateY(-108vh) translateX(var(--drift,10px)); opacity:0; }
  }

  /* ---------- card ---------- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    opacity:0;
    transform:translateY(14px);
    animation:cardIn 1s cubic-bezier(.22,.9,.32,1) forwards;
    animation-delay:0.15s;
  }
  @keyframes cardIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .card{
    background:linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border-radius:20px;
    padding:40px 30px 30px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 40px 80px -20px rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.4);
  }

  .kicker{
    text-align:center;
    margin:0 0 28px;
  }
  .kicker-name{
    display:block;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:27px;
    color:var(--ink);
    letter-spacing:0.3px;
  }
  .kicker-sub{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:7px;
  }
  .kicker-sub::before,
  .kicker-sub::after{
    content:"";
    height:1px;
    width:20px;
    background:var(--accent-soft);
  }
  .kicker-sub span{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    color:var(--accent);
    letter-spacing:0.3px;
  }

  /* ---------- tree scene ---------- */
  .scene{
    position:relative;
    width:100%;
    height:186px;
    margin-bottom:26px;
  }
  .scene svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }
  .branch{
    fill:none;
    stroke:#9c7248;
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:220;
    stroke-dashoffset:220;
    animation:draw 1.6s cubic-bezier(.3,.8,.4,1) forwards;
  }
  .branch.b2{ stroke-width:3.6; animation-delay:0.35s; }
  .branch.b3{ stroke-width:3.6; animation-delay:0.5s; }
  .branch.b4{ stroke-width:2.8; animation-delay:0.68s; }
  .branch.b5{ stroke-width:2.8; animation-delay:0.8s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .ground-line{
    position:absolute;
    left:8%;
    right:8%;
    bottom:10px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  }
  .sunflower{
    position:absolute;
    font-size:0;
    line-height:0;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    animation:bloom 0.55s cubic-bezier(.3,1.5,.5,1) forwards;
  }
  .sunflower::before{
    content:"🌻";
    font-size:var(--fs,18px);
  }
  @keyframes bloom{
    to{ transform:translate(-50%,-50%) scale(1) rotate(var(--rot,0deg)); opacity:1; }
  }
  .twig{
    fill:none;
    stroke:#9c7248;
    stroke-width:1.3;
    stroke-linecap:round;
    opacity:0.8;
  }
  .petal{
    position:absolute;
    top:-6%;
    opacity:0;
    animation:fall linear forwards;
    will-change:transform,opacity;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    85%{ opacity:0.55; }
    100%{ transform:translateY(230px) translateX(var(--sway,10px)) rotate(160deg); opacity:0; }
  }

  /* ---------- typed message ---------- */
  .message{
    font-size:15px;
    line-height:1.7;
    color:var(--ink);
    font-weight:400;
    min-height:126px;
  }
  .message p{
    margin:0 0 12px;
    white-space:normal;
    overflow-wrap:break-word;
    opacity:0;
    letter-spacing:0.1px;
  }
  .message p.typing::after{
    content:"";
    display:inline-block;
    width:1.5px;
    height:0.95em;
    margin-left:2px;
    vertical-align:-1px;
    background:var(--ink-soft);
    animation:caret 0.8s step-end infinite;
  }
  .message p.signature{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:21px;
    color:var(--accent);
    margin-top:6px;
    letter-spacing:0.2px;
  }
  @keyframes caret{ 50%{ opacity:0; } }

  /* ---------- note (reemplaza el contador) ---------- */
  .note{
    margin-top:22px;
    padding:16px 18px;
    border-radius:12px;
    background:rgba(180,137,63,0.07);
    border-left:2px solid var(--accent);
    opacity:0;
    transform:translateY(6px);
  }
  .note.show{
    animation:noteIn 0.9s cubic-bezier(.22,.9,.32,1) forwards;
  }
  @keyframes noteIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .note-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-weight:500;
  }
  .note-text{
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
    margin:0;
  }

  .foot{
    text-align:center;
    margin-top:24px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    letter-spacing:0.3px;
    color:rgba(226,190,140,0.55);
    opacity:0;
    animation:fadeSimple 1s ease forwards;
    animation-delay:9.5s;
  }
  @keyframes fadeSimple{ to{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    .branch, .sunflower, .note, .petal, .amb-heart, .stage{
      animation-duration:0.01ms !important;
      animation-delay:0s !important;
    }
  }
</style>
</head>
<body>

  <div class="ambient" id="ambient"></div>

  <div class="stage">
    <main class="card">
      <p class="kicker">
        <span class="kicker-name">Karen</span>
        <span class="kicker-sub"><span>bonita</span></span>
      </p>

      <div class="scene" id="scene">
        <svg viewBox="0 0 260 186" preserveAspectRatio="xMidYMax meet">
          <path class="branch"    d="M130,186 C130,150 129,126 130,100" />
          <path class="branch b2" d="M130,124 C121,111 111,100 98,90" />
          <path class="branch b3" d="M130,120 C139,105 152,95 166,86" />
          <path class="branch b4" d="M130,104 C124,92 117,82 107,74" />
          <path class="branch b5" d="M130,101 C137,89 146,80 158,72" />
        </svg>
        <div class="ground-line"></div>
      </div>

      <div class="message" id="message">
        <p data-text="Flores amarillas para ti, bonita:"></p>
        <p data-text="Si pudiera elegir un lugar seguro, sería a tu lado."></p>
        <p data-text="Cuanto más tiempo estoy contigo, más te quiero."></p>
        <p class="signature" data-text="— Te quiero"></p>
      </div>

      <div class="note">
        <p class="note-label">Un mensaje para ti</p>
        <p class="note-text">Sé que no pude darte tus flores amarillas aún, pero te quiero demostrar que me importas y te quiero.</p>
      </div>
    </main>
    <p class="foot">bonita</p>
  </div>

<script>
  (function buildHeart(){
    const scene = document.getElementById('scene');
    const svg = scene.querySelector('svg');
    const cx = 130, cy = 76, scale = 3.7;
    const base = { x: 130, y: 100 };

    function heartPoint(t, r){
      const x = 16 * Math.pow(Math.sin(t),3) * r;
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * r;
      return { x: cx + x*scale*0.62, y: cy + y*scale*0.5 };
    }

    const outline = [];
    const N = 38;
    for(let i=0;i<N;i++){
      outline.push(heartPoint((i/N)*Math.PI*2, 1));
    }

    const fillPts = [];
    const rings = [0.8, 0.58, 0.34, 0.12];
    rings.forEach((r, ri)=>{
      const count = [26,17,10,4][ri];
      for(let i=0;i<count;i++){
        const t = (i/count)*Math.PI*2 + ri*0.4;
        fillPts.push(heartPoint(t, r));
      }
    });

    let delay = 0.85;
    const step = 0.022;

    // ramitas: cada flor del contorno nace de una pequeña rama desde el tronco
    outline.forEach((p)=>{
      const midX = (base.x + p.x)/2 + (Math.random()*8-4);
      const midY = (base.y + p.y)/2 - 6;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', `M${base.x},${base.y} Q${midX},${midY} ${p.x.toFixed(1)},${p.y.toFixed(1)}`);
      path.setAttribute('class','twig');
      svg.appendChild(path);
      requestAnimationFrame(()=>{
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        path.style.transition = 'stroke-dashoffset 0.45s ease-out';
        const d = delay;
        setTimeout(()=>{ path.style.strokeDashoffset = '0'; }, d*1000);
      });
      delay += step;
    });

    delay = 0.85;
    const flowerDelays = [];
    outline.forEach(()=>{ flowerDelays.push(delay); delay += step; });
    outline.forEach((p,i)=>{
      const el = document.createElement('div');
      el.className = 'sunflower';
      const size = 12 + Math.random()*7;
      el.style.setProperty('--fs', size.toFixed(1)+'px');
      el.style.setProperty('--rot', (Math.random()*20-10).toFixed(1)+'deg');
      el.style.left = ((p.x/260)*100).toFixed(2)+'%';
      el.style.top  = ((p.y/186)*100).toFixed(2)+'%';
      el.style.animationDelay = (flowerDelays[i]+0.28).toFixed(2)+'s';
      scene.appendChild(el);
    });

    let fillDelay = delay + 0.15;
    fillPts.forEach((p)=>{
      const el = document.createElement('div');
      el.className = 'sunflower';
      const size = 11 + Math.random()*8;
      el.style.setProperty('--fs', size.toFixed(1)+'px');
      el.style.setProperty('--rot', (Math.random()*22-11).toFixed(1)+'deg');
      el.style.left = ((p.x/260)*100).toFixed(2)+'%';
      el.style.top  = ((p.y/186)*100).toFixed(2)+'%';
      fillDelay += 0.016 + Math.random()*0.014;
      el.style.animationDelay = fillDelay.toFixed(2)+'s';
      scene.appendChild(el);
    });

    const bloomEnd = fillDelay + 0.6;

    function spawnPetal(){
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = Math.random() > 0.5 ? '🌼' : '🌻';
      p.style.left = (32 + Math.random()*50) + '%';
      p.style.setProperty('--sway', (Math.random()*30-15).toFixed(0)+'px');
      p.style.animationDuration = (4.2 + Math.random()*2).toFixed(1)+'s';
      p.style.fontSize = (9 + Math.random()*5).toFixed(0)+'px';
      scene.appendChild(p);
      setTimeout(()=>p.remove(), 7000);
    }
    setTimeout(()=>{
      setInterval(spawnPetal, 1300);
      spawnPetal();
    }, bloomEnd*1000);
  })();

  (function typeMessage(){
    const paras = Array.from(document.querySelectorAll('#message p'));
    const note = document.querySelector('.note');
    let i = 0;

    function typeLine(p, cb){
      const full = p.getAttribute('data-text') || '';
      p.style.opacity = '1';
      p.classList.add('typing');
      let c = 0;
      const speed = 30;
      const timer = setInterval(()=>{
        c++;
        p.textContent = full.slice(0, c);
        if(c >= full.length){
          clearInterval(timer);
          p.classList.remove('typing');
          setTimeout(cb, 420);
        }
      }, speed);
    }

    function next(){
      if(i >= paras.length){
        note.classList.add('show');
        return;
      }
      const p = paras[i++];
      typeLine(p, next);
    }

    setTimeout(next, 2600);
  })();

  (function ambientHearts(){
    const wrap = document.getElementById('ambient');
    for(let i=0;i<8;i++){
      const h = document.createElement('div');
      h.className = 'amb-heart';
      h.textContent = '♡';
      h.style.left = (Math.random()*100)+'%';
      h.style.fontSize = (12 + Math.random()*14)+'px';
      h.style.setProperty('--drift', (Math.random()*40-20).toFixed(0)+'px');
      h.style.animationDuration = (14 + Math.random()*10).toFixed(1)+'s';
      h.style.animationDelay = (Math.random()*14).toFixed(1)+'s';
      wrap.appendChild(h);
    }
  })();
</script>
</body>
</html>
